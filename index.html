<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autosevice</title>
    <script>
      ;(() => {
        const originalFetch = window.fetch.bind(window)
        window.fetch = (input, init) => {
          const rawUrl = typeof input === 'string' ? input : input && input.url
          if (typeof rawUrl === 'string') {
            const rewritten = rawUrl
              .replace(/^http:\/\/localhost:5010\/api\//, '/api/')
              .replace(/^http:\/\/127\.0\.0\.1:5010\/api\//, '/api/')
            if (rewritten !== rawUrl) {
              if (typeof input === 'string') return originalFetch(rewritten, init)
              return originalFetch(new Request(rewritten, input), init)
            }
          }
          return originalFetch(input, init)
        }
      })()
    </script>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
